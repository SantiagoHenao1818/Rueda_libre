<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva</title>
    <link rel="stylesheet" href="reservas.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <nav class="Navbar">
        <div class="logo">
            <img class="logo-icon" src="img/Logo.svg" alt="Logo-parche">
            <span class="logo-text">Parche y Pedal</span>
        </div>
        
        <ul class="nav-links">
            <li><a href="#quienes-somos">¿Quiénes somos?</a></li>
            <li><a href="#servicios">Nuestros servicios</a></li>
            <li><a href="#como-alquilar">Cómo Alquilar</a></li>
        </ul>

      <button class="Boton-1" onclick="location.href='tarifas.html'">Tarifas</button>
    </nav>



    <form action="/my-handling-form-page" method="post">
  <p>
    <label for="name">Nombre Completo:</label>
    <input type="text" id="name" name="user_name" />
  </p>
  <p>
    <label for="mail">Email:</label>
    <input type="email" id="mail" name="user_email" />
  </p>
  <label for="pet-select">Tipo de documento</label>

<select name="ids" id="tipo-id">
  <option value="cc">Cedula de Ciudadania</option>
  <option value="ti">Tarjeta de Identidad</option>
  <option value="ce">Cedula de Extrajeria</option>
  <option value="pasaporte">Pasaporte</option>
  </select>
  <section>
  <h2>Payment information</h2>
  <p>
    <label for="card">
      <span>Card type:</span>
    </label>
    <select id="card" name="user-card">
      <option value="visa">Visa</option>
      <option value="mc">Mastercard</option>
      <option value="amex">American Express</option>
    </select>
  </p>
  <p>
    <label for="number">Card number *:</label>
    <input type="tel" id="number" name="card-number" required />
  </p>
  <p>
    <label for="expiration">Expiration date *:</label>
    <input
      type="text"
      id="expiration"
      name="expiration"
      required
      placeholder="MM/YY"
      pattern="^(0[1-9]|1[0-2])\/([0-9]{2})$" />
  </p>
</section>
<section>
  <p>
    <button type="submit">Validar informacion</button>
  </p>
</section>
</form> 
</form>
</body>
</html>
